services:
  postgres:
    image: postgres:17
    container_name: lassie-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: lassie_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - lassie-postgres-dev-data:/var/lib/postgresql/data

volumes:
  lassie-postgres-dev-data:
